<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pen Fight · Desk Battle</title>
<meta name="description" content="The last-bench classic, online. Flick your pen and knock your friends' pens off the desk. 2 to 5 players, each on their own phone.">
<meta name="theme-color" content="#2350c9">
<meta property="og:title" content="Pen Fight · Desk Battle">
<meta property="og:description" content="Pen fight! Join my room and knock my pen off the desk. 2 to 5 players.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b07a45'/%3E%3Crect x='5' y='13.5' width='22' height='5' rx='2.5' fill='%232f66d0' transform='rotate(-30 16 16)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a notebook page holding one desk. Ruled paper, ballpoint-blue ink, a red margin line; the desk is the only wood on the page. */
:root {
  --bg: #f5f2e8; --rule: rgba(64, 110, 190, .14); --margin: rgba(214, 69, 93, .45);
  --surface: #fffdf7; --surface2: #ece7d8; --ink: #1f2230; --muted: #5f6272; --line: #d8d1bf;
  --accent: #2350c9; --accent-ink: #ffffff; --hot: #e2512f; --gold: #f2b705; --danger: #c3261c; --focus: #2350c9;
  --shadow: 0 1px 0 rgba(31,34,48,.05), 0 10px 24px -16px rgba(31,34,48,.35);
  --f-hand: "Caveat", "Comic Sans MS", "Segoe Print", cursive;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141d; --rule: rgba(120, 160, 255, .07); --margin: rgba(255, 110, 130, .25);
    --surface: #191d2a; --surface2: #232838; --ink: #eceef6; --muted: #a3a7b8; --line: #2e3446;
    --accent: #7ea2ff; --accent-ink: #0c1230; --hot: #ff8a65; --gold: #ffd23f; --danger: #ff7a6e; --focus: #9cb8ff;
    --shadow: 0 12px 28px -16px rgba(0,0,0,.8); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141d; --rule: rgba(120, 160, 255, .07); --margin: rgba(255, 110, 130, .25);
  --surface: #191d2a; --surface2: #232838; --ink: #eceef6; --muted: #a3a7b8; --line: #2e3446;
  --accent: #7ea2ff; --accent-ink: #0c1230; --hot: #ff8a65; --gold: #ffd23f; --danger: #ff7a6e; --focus: #9cb8ff;
  --shadow: 0 12px 28px -16px rgba(0,0,0,.8); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); min-height: 100%; }
body {
  margin: 0; font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
}
html.ingame body { overscroll-behavior: none; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.ico { display: inline-flex; flex: none; }

#app { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: env(safe-area-inset-top, 0px) calc(40px + env(safe-area-inset-bottom, 0px)); }
.hdr { display: flex; align-items: center; gap: 10px; padding-block: 12px; margin-bottom: 12px; border-bottom: 2px solid var(--margin); }
.hbrand { background: none; border: 0; padding: 0; cursor: default; }
.logo { font-family: var(--f-hand); font-weight: 700; font-size: 30px; line-height: 1; color: var(--accent); white-space: nowrap; }
.chip { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; background: var(--surface2); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.htools { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.iconlink { font-weight: 700; font-size: 13px; color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; flex: none; }
.main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h2 { font-family: var(--f-hand); font-weight: 700; font-size: 32px; line-height: 1; margin: 0; text-wrap: balance; }
.card h3 { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
.card p { margin: 0; }
.sumh { font-family: var(--f-hand); font-weight: 700; font-size: 28px; cursor: pointer; }
.cardhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.count { font-family: var(--f-mono); color: var(--muted); }
.dim { color: var(--muted); }
.hint { color: var(--muted); font-size: 13px; }
.lbl { font-size: 13px; font-weight: 700; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.resume { border-color: var(--accent); }
.code-inline { font-family: var(--f-mono); letter-spacing: .12em; }

/* hero */
.hero { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 12px 4px; position: relative; }
.herotext { flex: 1 1 280px; min-width: 0; }
.kicker { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--hot); }
.brand-big { font-family: var(--f-hand); font-weight: 700; font-size: clamp(64px, 17vw, 104px); line-height: .85; margin: 6px 0 0; color: var(--ink); }
.brand-big .dot { color: var(--hot); }
.hero.small .brand-big { font-size: 56px; }
.tagline { margin: 10px 0 0; color: var(--muted); font-size: 17px; max-width: 42ch; }
.heroart { flex: 1 1 220px; width: 100%; max-width: 300px; height: 160px; border-radius: 14px; transform: rotate(-2deg); box-shadow: 0 16px 30px -18px rgba(60,30,10,.7); }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); cursor: pointer; font-weight: 800; text-align: center; }
.btn:active:not([disabled]) { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--danger); color: #fff; border-color: transparent; }
.btn.small { min-height: 34px; padding: 6px 12px; font-size: 13px; }
.btn.big { min-height: 54px; font-size: 18px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; box-shadow: none; }
.card > .btn { align-self: flex-start; }
.card > .btn.primary, .card > .btn.big { align-self: stretch; }
input[type=text], select { min-height: 46px; padding: 9px 13px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); width: 100%; min-width: 0; }
.joinrow { display: flex; gap: 8px; }
.joinrow input { flex: 1; }
.joinrow .btn { flex: none; }
.codein { font-family: var(--f-mono); font-size: 22px !important; letter-spacing: .35em; text-transform: uppercase; text-align: center; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 13px; background: var(--surface2); }
.segb { flex: 1 1 auto; min-height: 40px; padding: 6px 12px; border-radius: 10px; border: 0; background: transparent; cursor: pointer; font-weight: 800; color: var(--muted); }
.segb.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); }

/* pen picker */
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.skinb { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-size: 12px; font-weight: 700; color: var(--muted); }
.skinb.on { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); color: var(--ink); }
.skinb[disabled] { opacity: .3; cursor: not-allowed; }
.penprev { display: block; max-width: 100%; }
.lrows { display: flex; flex-direction: column; gap: 8px; }
.lrow { display: flex; align-items: center; gap: 10px; }
.lrow .penprev { flex: none; }
.howlist { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; color: var(--muted); }
.howlist strong { color: var(--ink); }

/* room */
.roomtop { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.roominfo { display: flex; flex-direction: column; gap: 10px; flex: 1 1 240px; min-width: 0; }
.code { display: flex; gap: 8px; }
.code span { font-family: var(--f-hand); font-weight: 700; font-size: clamp(44px, 13vw, 60px); line-height: 1; width: 1.05em; padding-block: 6px 2px; text-align: center; border-radius: 12px; background: var(--surface2); border-bottom: 3px solid var(--hot); }
.qr { width: 144px; height: 144px; padding: 8px; border-radius: 12px; background: #fff; flex: none; }
.qr svg { width: 100%; height: 100%; display: block; }
.seats { display: flex; flex-direction: column; gap: 8px; }
.seat { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); min-height: 50px; flex-wrap: wrap; }
.seat .nm { font-weight: 800; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.seat.empty { justify-content: center; border-style: dashed; background: transparent; color: var(--muted); }
.seat.empty .nm { font-weight: 600; font-size: 13px; }
.seat.off { opacity: .6; }
.tag { font-style: normal; font-size: 10.5px; font-weight: 800; padding: 1px 7px; border-radius: 99px; background: var(--surface2); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.tag.warnt { color: var(--danger); }
.xbtn { margin-left: auto; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.sitbox { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }

/* game */
.hud { display: flex; gap: 6px; flex-wrap: wrap; }
.hud .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 800; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; max-width: 100%; }
.hud .chip.active { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
.hud .chip.out { opacity: .45; }
.hud .chip.out .cn { text-decoration: line-through; }
.hud .chip.offline .cn::after { content: " \00b7 offline"; color: var(--danger); font-weight: 700; }
.swatch { width: 12px; height: 12px; border-radius: 4px; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
.cn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pips { display: inline-flex; gap: 3px; }
.pip { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); }
.pip.on { background: var(--hot); border-color: var(--hot); }
.stage { position: relative; align-self: center; touch-action: none; user-select: none; -webkit-user-select: none; max-width: 100%; }
.desk { display: block; touch-action: none; cursor: crosshair; border-radius: 18px; }
.stage-ov { position: absolute; inset: 0; display: none; place-items: center; padding: 12px; pointer-events: none; overflow-y: auto; }
.stage-ov.show { display: grid; background: rgba(10, 12, 20, .5); border-radius: 18px; animation: fade .3s ease; }
.ovcard { pointer-events: auto; width: min(340px, 100%); max-height: 100%; overflow-y: auto; background: var(--surface); color: var(--ink); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; box-shadow: 0 24px 50px -20px rgba(0,0,0,.7); animation: pop .4s cubic-bezier(.2,.9,.3,1.3); }
.ovcard.win > .ico { color: var(--gold); }
.ov-k { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.ov-t { margin: 0; font-family: var(--f-hand); font-weight: 700; font-size: 40px; line-height: 1; text-wrap: balance; overflow-wrap: anywhere; }
.ov-s { margin: 0; color: var(--muted); }
.scores { list-style: none; margin: 6px 0 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 6px; }
.scores li { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; background: var(--bg); font-weight: 800; }
.scores li .pips { margin-left: auto; }
.ovbtns { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 6px; }
.status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-weight: 800; }
.status.mine { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, var(--surface)); }
.status > span:first-child { flex: 1 1 200px; min-width: 0; }
.timer { display: flex; align-items: center; gap: 8px; flex: 0 1 160px; }
.tbar { flex: 1; height: 6px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.tfill { display: block; height: 100%; background: var(--accent); border-radius: 99px; width: 100%; }
.tfill.low { background: var(--danger); }
.ttxt { font-family: var(--f-mono); font-size: 13px; color: var(--muted); min-width: 3ch; text-align: right; }
.below { display: flex; flex-direction: column; gap: 8px; }
.reacts { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.react { width: 46px; height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 22px; cursor: pointer; }
.react:active { transform: scale(.92); }
.tools { justify-content: center; }
.ticker { margin: 0; text-align: center; color: var(--muted); font-size: 14px; }
.watching { margin: 0; text-align: center; font-weight: 700; color: var(--muted); }

/* teams */
.teamb { font-style: normal; font-size: 11px; font-weight: 800; padding: 2px 9px; border-radius: 99px; color: #fff; border: 0; text-transform: uppercase; letter-spacing: .05em; }
button.teamb { cursor: pointer; min-height: 28px; }
.teamb.t0, .bigteam.t0 { background: #2f66d0; }
.teamb.t1, .bigteam.t1 { background: #d6455d; }
.seat.t0 { box-shadow: inset 4px 0 0 #2f66d0; }
.seat.t1 { box-shadow: inset 4px 0 0 #d6455d; }
.hud .chip.t0 { box-shadow: inset 3px 0 0 #2f66d0; }
.hud .chip.t1 { box-shadow: inset 3px 0 0 #d6455d; }
.hud .chip.t0.active, .hud .chip.t1.active { box-shadow: 0 0 0 2px var(--gold); }
.hudwrap { display: flex; flex-direction: column; gap: 8px; }
.teambar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.tside { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-radius: 10px; color: #fff; font-weight: 800; flex: 1 1 0; min-width: 0; }
.tside.t1 { flex-direction: row-reverse; }
.tside.t0 { background: #2f66d0; }
.tside.t1 { background: #d6455d; }
.tname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tscore { font-family: var(--f-hand); font-size: 30px; line-height: 1; }
.tvs { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }
.bigteam { color: #fff; font-weight: 800; padding: 4px 14px; border-radius: 99px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
.ovcard.t0 { border-top: 6px solid #2f66d0; }
.ovcard.t1 { border-top: 6px solid #d6455d; }

/* connection, toast */
.connwrap { margin-bottom: 12px; }
.connbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: 12px; background: color-mix(in srgb, var(--gold) 18%, var(--surface)); border: 1px solid color-mix(in srgb, var(--gold) 50%, var(--line)); }
.connbar.bad { background: color-mix(in srgb, var(--danger) 12%, var(--surface)); border-color: var(--danger); }
.connbar .ctext { flex: 1 1 200px; min-width: 0; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--ink) 25%, transparent); border-top-color: var(--ink); animation: spin .8s linear infinite; flex: none; }
.err { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--danger) 12%, var(--surface)); border: 1px solid var(--danger); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 700; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
@media (max-width: 480px) {
  .card { padding: 15px; }
  .joinrow { flex-direction: column; }
  .qr { width: 116px; height: 116px; }
  .heroart { height: 130px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

</style>

        var b = bin.read();

        return b;

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];

            } else {

              bytes.push(b & 0xff);
            }
          } else {

          }
        }
      }
      return bytes;
    };

/* ================= shell ================= */

function screen() {

}
const OPEN = {};

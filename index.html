<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Mafia Night Table</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a single card column like a dealt hand, with a chat rail on wide screens. Night is ink-blue felt, day is warm paper. */
:root {
  --bg: #f3efe6;
  --surface: #fffdf8;
  --surface2: #ece6d8;
  --ink: #1d1b22;
  --muted: #625c6b;
  --line: #d9d1bf;
  --accent: #9b1c2c;         /* oxblood */
  --accent-ink: #ffffff;
  --gold: #a87414;
  --town: #24656b;
  --night: #172036;
  --night-ink: #e7e9f3;
  --night-muted: #a7afc8;
  --danger: #b4231b;
  --focus: #2a59c9;
  --shadow: 0 1px 0 rgba(29,27,34,.05), 0 6px 20px -12px rgba(29,27,34,.25);
  --f-display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1220; --surface: #171b2c; --surface2: #20263b; --ink: #ece9f2; --muted: #a29fb2; --line: #2c3350;
    --accent: #e0566a; --accent-ink: #1a0b0f; --gold: #e2b14d; --town: #6cc1c4; --night: #0a0d1a; --night-ink: #e7e9f3;
    --night-muted: #9aa3c0; --danger: #ff7a6e; --focus: #8fb0ff; --shadow: 0 8px 26px -14px rgba(0,0,0,.7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1220; --surface: #171b2c; --surface2: #20263b; --ink: #ece9f2; --muted: #a29fb2; --line: #2c3350;
  --accent: #e0566a; --accent-ink: #1a0b0f; --gold: #e2b14d; --town: #6cc1c4; --night: #0a0d1a; --night-ink: #e7e9f3;
  --night-muted: #9aa3c0; --danger: #ff7a6e; --focus: #8fb0ff; --shadow: 0 8px 26px -14px rgba(0,0,0,.7); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.ico { display: inline-flex; flex: none; }

#app { max-width: 1060px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; }
.hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.hbrand { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--accent); }
.logo { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: .01em; color: var(--ink); }
.chip { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; background: var(--surface2); color: var(--muted); white-space: nowrap; }
.htools { display: flex; align-items: center; gap: 6px; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--ink); }
.iconbtn:hover { background: var(--surface2); }

.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; }
@media (min-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr) 330px; } .side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); } }
.main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.side { min-width: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h2 { font-family: var(--f-display); font-weight: 600; font-size: 24px; line-height: 1.15; margin: 0; text-wrap: balance; }
.card h3 { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
.card p { margin: 0; }
.dim { color: var(--muted); }
.hint { color: var(--muted); font-size: 13px; }
.small { font-size: 13px; }
.warn { color: var(--danger); font-size: 14px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
ul.plain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }

.hero { padding-block: 18px 6px; }
.hero.small { padding-block: 4px 0; }
.brand-big { font-family: var(--f-display); font-weight: 800; font-size: clamp(56px, 13vw, 104px); line-height: .9; margin: 0; letter-spacing: -.01em; color: var(--ink); }
.hero.small .brand-big { font-size: clamp(40px, 9vw, 60px); }
.brand-big::after { content: "."; color: var(--accent); }
.tagline { margin: 10px 0 0; color: var(--muted); font-size: 17px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 10px 18px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface2); cursor: pointer; font-weight: 600; text-align: center; }
.btn:hover:not([disabled]) { filter: brightness(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--danger); color: #fff; border-color: transparent; }
.btn.small { min-height: 34px; padding: 6px 12px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.card > .btn { align-self: flex-start; }
.card > .btn.primary { align-self: stretch; }

input[type=text], select { min-height: 44px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); width: 100%; min-width: 0; }
.joinrow, .chatform { display: flex; gap: 8px; }
.joinrow input, .chatform input { flex: 1; }
.joinrow .btn, .chatform .btn { flex: none; }

/* seats */
.seats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.seat { display: grid; grid-template-columns: 34px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 10px; align-items: center; padding: 9px 10px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); text-align: left; min-height: 54px; min-width: 0; }
.seat .av { grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #fff; background: hsl(var(--h) 45% 42%); }
.seat .sn { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.seat .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .sub { grid-column: 2; font-size: 12px; color: var(--muted); }
.seat .sub.wait { color: var(--gold); }
.seat .tag { font-style: normal; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 99px; background: var(--surface2); color: var(--muted); }
.seat .tag.ally { background: var(--accent); color: var(--accent-ink); }
.seat.dead { opacity: .55; }
.seat.dead .nm { text-decoration: line-through; }
.seat.empty { display: flex; justify-content: center; border-style: dashed; background: transparent; color: var(--muted); }
.seat.empty .nm { font-weight: 500; font-size: 13px; }
button.seat { cursor: pointer; width: 100%; }
button.seat.pick:hover { border-color: var(--accent); }
.seat.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--bg)); }
.seat:not(.pick):not(.skip)[data-id] { cursor: default; }
.seat.skip { display: flex; justify-content: center; min-height: 46px; width: 100%; cursor: pointer; }
.seat.skip .nm { font-weight: 600; }
.seatwrap { position: relative; min-width: 0; }
.xbtn { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.seat.reveal.mafia { border-color: var(--accent); }
.seat.reveal.mafia .sub { color: var(--accent); font-weight: 600; }

/* banner */
.banner { border-radius: var(--r); padding: 18px; display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; border: 1px solid var(--line); }
.banner .bl { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
.banner .bt { font-family: var(--f-display); font-weight: 800; font-size: clamp(28px, 6vw, 38px); line-height: 1.05; margin: 0; }
.banner .bs { margin: 4px 0 0; }
.banner .bw { margin: 6px 0 0; font-size: 13px; }
.banner.night { background: var(--night); color: var(--night-ink); border-color: transparent; background-image: radial-gradient(circle at 85% 20%, rgba(255,255,255,.08) 0 1px, transparent 2px), radial-gradient(circle at 70% 60%, rgba(255,255,255,.07) 0 1px, transparent 2px), radial-gradient(circle at 92% 75%, rgba(255,255,255,.06) 0 1px, transparent 2px); }
.banner.night .bs, .banner.night .bw { color: var(--night-muted); }
.banner.day { background: var(--surface); }
.banner.day .ico { color: var(--gold); }
.banner.day .bs, .banner.day .bw { color: var(--muted); }
.banner.over { background: var(--surface); }
.banner.over.mafia { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.banner.over.town { background: var(--town); color: #fff; border-color: transparent; }
.timer { font-family: var(--f-mono); font-size: 26px; font-variant-numeric: tabular-nums; padding: 4px 12px; border-radius: 10px; background: rgba(127,127,127,.14); }
.timer.low { color: var(--danger); }
.banner.night .timer.low { color: #ff9a8f; }

/* role card */
.card.role { flex-direction: row; align-items: flex-start; gap: 14px; border-width: 1px; }
.card.role > .ico { color: var(--town); margin-top: 6px; }
.card.role.mafia { border-color: var(--accent); }
.card.role.mafia > .ico { color: var(--accent); }
.rbody { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.rname { font-size: 34px !important; font-weight: 800 !important; }
.rblurb { color: var(--muted); max-width: 60ch; }
.allies strong { color: var(--accent); }
.rbody .btn { align-self: flex-start; margin-top: 4px; }
.rolebar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border: 1px dashed var(--line); border-radius: var(--r); }
.rolebar.mini { justify-content: flex-start; font-weight: 600; border-style: solid; background: var(--surface); }

/* news */
.news li { padding-left: 14px; position: relative; }
.news li::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.news li.N::before { background: var(--night); box-shadow: 0 0 0 1px var(--night-muted); }
.news li.V::before { background: var(--gold); }
.news li.E::before { background: var(--accent); }
details summary { cursor: pointer; font-weight: 600; }
details.ballot, details.history, details.narrator { border-top: 1px solid var(--line); padding-top: 8px; }
details > ul { margin-top: 8px !important; }
.how .howrow { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; }
.how h4 { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); }
.how p { margin: 0; color: var(--muted); }
.how summary { font-family: var(--f-display); font-size: 20px; }

/* config */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface2); }
.segb { flex: 1 1 auto; min-height: 38px; padding: 6px 12px; border-radius: 9px; border: 0; background: transparent; cursor: pointer; font-weight: 600; color: var(--muted); }
.segb.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.toggles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
.toggle { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; text-align: left; }
.toggle .tk { flex: none; width: 34px; height: 20px; border-radius: 99px; background: var(--line); position: relative; transition: background .15s; }
.toggle .tk::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle.on .tk { background: var(--accent); }
.toggle.on .tk::after { transform: translateX(14px); }
.toggle .tl { display: flex; flex-direction: column; font-weight: 600; min-width: 0; }
.toggle small { font-weight: 400; color: var(--muted); font-size: 12px; }
.timesel { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.preview { font-weight: 600; padding: 10px 12px; border-radius: 10px; background: var(--surface2); }

/* local */
.namelist { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.pass { font-size: 18px !important; font-family: var(--f-body) !important; color: var(--muted); }
.passname { font-family: var(--f-display); font-weight: 800; font-size: clamp(40px, 10vw, 64px); line-height: 1; overflow-wrap: anywhere; }

/* chat */
.dock { gap: 8px; }
.dock h2 { font-size: 20px; }
.chatlog { height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); overflow-wrap: anywhere; }
.chatlog.small { height: 150px; }
.msg { font-size: 14px; }
.msg b { color: var(--accent); }
.msg.mine b { color: var(--town); }
.msg.ghost { opacity: .7; font-style: italic; }
.mchat { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.mates li { font-size: 14px; }

.err { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 11px; background: color-mix(in srgb, var(--danger) 12%, var(--surface)); border: 1px solid var(--danger); color: var(--ink); }

@media (max-width: 480px) {
  .card { padding: 15px; }
  .seats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .how .howrow { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .joinrow { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<div id="app"></div>
<script>
/* ===== Mafia engine: pure rules, no DOM, JSON-safe state ===== */
const Engine = (function () {
  'use strict';

  const MIN_PLAYERS = 4;
  const MAX_PLAYERS = 8;

  const ROLES = {
    mafia:     { label: 'Mafia',     team: 'mafia', kind: 'kill'  },
    doctor:    { label: 'Doctor',    team: 'town',  kind: 'save'  },
    police:    { label: 'Police',    team: 'town',  kind: 'check' },
    prankster: { label: 'Prankster', team: 'town',  kind: 'prank' },
    civilian:  { label: 'Civilian',  team: 'town',  kind: 'sleep' }
  };

  /* ---------- config ---------- */
  function defaultConfig() {
    return {
      mafia: 'auto',        // 'auto' | 1 | 2
      doctor: true,
      police: true,
      prankster: true,
      reveal: 'role',       // what everyone learns when a player is out: 'role' | 'team' | 'none'
      nightSecs: 0,         // 0 = wait for everyone
      discussSecs: 0,
      voteSecs: 0
    };
  }

  function secs(v) {
    const n = Math.floor(Number(v));
    return isFinite(n) && n > 0 ? Math.min(n, 900) : 0;
  }

  function normalizeConfig(c) {
    const d = defaultConfig();
    c = c || {};
    const m = c.mafia === 'auto' || c.mafia === undefined ? 'auto' : Number(c.mafia);
    return {
      mafia: m === 1 || m === 2 ? m : 'auto',
      doctor: c.doctor === undefined ? d.doctor : !!c.doctor,
      police: c.police === undefined ? d.police : !!c.police,
      prankster: c.prankster === undefined ? d.prankster : !!c.prankster,
      reveal: c.reveal === 'team' || c.reveal === 'none' ? c.reveal : 'role',
      nightSecs: secs(c.nightSecs),
      discussSecs: secs(c.discussSecs),
      voteSecs: secs(c.voteSecs)
    };
  }

  function maxMafia(n) { return n >= 6 ? 2 : 1; }

  function buildRoles(n, cfgIn) {
    const cfg = normalizeConfig(cfgIn);
    const notes = [];
    let m = cfg.mafia === 'auto' ? (n <= 5 ? 1 : 2) : cfg.mafia;
    if (m > maxMafia(n)) {
      m = maxMafia(n);
      notes.push('Mafia limited to ' + m + ' with ' + n + ' players.');
    }
    const specials = [];
    if (cfg.doctor) specials.push('doctor');
    if (cfg.police) specials.push('police');
    if (cfg.prankster) specials.push('prankster');
    while (m + specials.length > n) {
      const dropped = specials.pop();
      notes.push(ROLES[dropped].label + ' left out: not enough players.');
    }
    const roles = [];
    for (let i = 0; i < m; i++) roles.push('mafia');
    specials.forEach(function (s) { roles.push(s); });
    while (roles.length < n) roles.push('civilian');
    const counts = {};
    roles.forEach(function (r) { counts[r] = (counts[r] || 0) + 1; });
    return { roles: roles, counts: counts, notes: notes };
  }

  /* ---------- helpers ---------- */
  function shuffle(arr, rng) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function P(st, id) {
    for (let i = 0; i < st.players.length; i++) if (st.players[i].id === id) return st.players[i];
    return null;
  }

  function aliveList(st) { return st.players.filter(function (p) { return p.alive; }); }

  function uniqueNames(players) {
    const seen = {};
    return players.map(function (p) {
      let base = String(p.name == null ? '' : p.name).replace(/\s+/g, ' ').trim().slice(0, 16) || 'Player';
      let name = base, i = 2;
      while (seen[name.toLowerCase()]) { name = base.slice(0, 13) + ' ' + i; i++; }
      seen[name.toLowerCase()] = true;
      return { id: p.id, name: name };
    });
  }

  function phaseKey(st) {
    const c = st.phase === 'night' ? 'N' : st.phase === 'discuss' ? 'T' : st.phase === 'vote' ? 'V' : st.phase === 'over' ? 'X' : 'L';
    return c + st.round;
  }

  function armTimer(st, now) {
    const s = st.phase === 'night' ? st.cfg.nightSecs
      : st.phase === 'discuss' ? st.cfg.discussSecs
      : st.phase === 'vote' ? st.cfg.voteSecs : 0;
    st.dl = s > 0 && now ? now + s * 1000 : null;
  }

  function addLog(st, ph, x) {
    st.log.push({ r: st.round, ph: ph, x: x });
    if (st.log.length > 120) st.log.splice(0, st.log.length - 120);
  }

  function addNote(st, id, x) {
    if (!st.notes[id]) st.notes[id] = [];
    st.notes[id].push({ r: st.round, x: x });
  }

  function revealText(st, p) {
    if (st.cfg.reveal === 'role') return ' Role: ' + ROLES[p.role].label + '.';
    if (st.cfg.reveal === 'team') return ' Team: ' + (p.role === 'mafia' ? 'Mafia' : 'Town') + '.';
    return '';
  }

  /* ---------- creation ---------- */
  function newGame(opts) {
    const rng = opts.rng || Math.random;
    const cleaned = uniqueNames(opts.players);
    const n = cleaned.length;
    if (n < MIN_PLAYERS || n > MAX_PLAYERS) throw new Error('Mafia needs ' + MIN_PLAYERS + ' to ' + MAX_PLAYERS + ' players.');
    const ids = {};
    cleaned.forEach(function (p) {
      if (ids[p.id]) throw new Error('Duplicate player id.');
      ids[p.id] = true;
    });
    const cfg = normalizeConfig(opts.cfg);
    const roles = shuffle(buildRoles(n, cfg).roles.slice(), rng);
    const st = {
      v: 1,
      gameId: opts.gameId,
      cfg: cfg,
      phase: 'night',
      round: 1,
      players: cleaned.map(function (p, i) {
        return { id: p.id, name: p.name, role: roles[i], alive: true, out: null };
      }),
      sub: {},
      lastSaved: null,
      intel: [],
      notes: {},
      log: [],
      ballot: null,
      recap: [],
      mafiaChat: [],
      relay: {},
      winner: null,
      dl: null,
      seq: 0
    };
    armTimer(st, opts.now);
    return st;
  }

  /* ---------- actions ---------- */
  function actionFor(st, p) {
    if (!p || !p.alive) return null;
    const alive = aliveList(st);
    if (st.phase === 'night') {
      const kind = ROLES[p.role].kind;
      if (kind === 'sleep') return { kind: kind, targets: [], blocked: {} };
      if (kind === 'kill') {
        return { kind: kind, blocked: {}, targets: alive.filter(function (x) { return x.role !== 'mafia'; }).map(function (x) { return x.id; }) };
      }
      if (kind === 'save') {
        const blocked = {};

        if (st.lastSaved && targets.indexOf(st.lastSaved) !== -1) {

      t.out = { ph: 'V', r: r };

    } else {

    MAX_PLAYERS: MAX_PLAYERS,

let renderDock = function () {}; // assigned in app2

function setErr(e) {
  S.err = typeof e === 'string' ? e : errText(e);
  try { console.error(e); } catch (x) { /* ignore */ }
  render();
}

/* ================= online layer ================= */
const H = { state: null, actions: {}, outbox: {}, q: Promise.resolve(), written: new Map(), loading: false, tick: null };

function isHost() { return !!(S.pub && S.me && S.pub.hostId === S.me); }
function inGame() { return !!(S.pub && S.pub.players && S.pub.players.some(function (p) { return p.id === S.me; })); }
function pubPlayer(id) { return S.pub && S.pub.players ? S.pub.players.find(function (p) { return p.id === id; }) : null; }
function nameOf(id) {
  const p = pubPlayer(id);
  if (p) return p.name;
  const r = S.roster.find(function (x) { return x.id === id; });
  if (r) return r.name || 'Player';
  return 'Player';
}

async function withRetry(fn) {
  try { return await fn(); }
  catch (e) {
    if (e && e.code === 'unavailable') { await sleep(300 + Math.random() * 500); return await fn(); }
    throw e;
  }
}

async function initOnline() {
  let db = null, user = null;
  try {
    if (window.claude && window.claude.use) {
      const r = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      db = r[0]; user = r[1];
    }
  } catch (e) { db = null; }
  S.db = db; S.user = user;
  try {
    if (user) {
      S.me = await user.id();
      S.canEdit = !!(await user.canEdit());
      S.canWrite = await user.can('data.write');
    }
  } catch (e) { /* identity unavailable */ }
  S.online = !!(db && S.me);
  S.boot = false;
  if (!S.online) { render(); return; }

  const onErr = function (e) { setErr(e); };
  db.doc('game/public').onSnapshot(function (snap) {
    S.pub = snap.exists ? snap.data() : null;
    S.pubAt = Date.now();
    S.pubLoaded = true;
    onPub();
    render();
  }, onErr);
  db.collection('players').onSnapshot(function (snap) {
    S.roster = snap.docs.map(function (d) { const v = d.data() || {}; return { id: d.id, name: v.name || 'Player', ts: v.ts || 0 }; })
      .sort(function (a, b) { return a.ts - b.ts || (a.id < b.id ? -1 : 1); });
    render();
  }, onErr);
  db.doc('views/' + S.me).onSnapshot(function (snap) {
    S.view = snap.exists ? snap.data() : null;
    render();
  }, onErr);
  db.collection('chat').onSnapshot(function (snap) {
    const m = {};
    snap.docs.forEach(function (d) { m[d.id] = d.data(); });
    S.chats = m;
    renderDock();
  }, onErr);
  if (S.canEdit) {
    db.collection('actions').onSnapshot(function (snap) {
      const m = {};
      snap.docs.forEach(function (d) { m[d.id] = d.data(); });
      H.actions = m;
      if (isHost() && H.state) hostEnqueue(hostIngest);
    }, onErr);
    db.collection('outbox').onSnapshot(function (snap) {
      const m = {};
      snap.docs.forEach(function (d) { m[d.id] = d.data(); });
      H.outbox = m;
      if (isHost() && H.state) hostEnqueue(hostIngest);
    }, onErr);
  }
  render();
}

function onPub() {
  if (!isHost()) { H.state = null; return; }
  if (!H.tick) H.tick = setInterval(hostTick, 1000);
  if (S.pub.phase === 'lobby') { H.state = null; return; }
  if (!H.state && !H.loading) {
    H.loading = true;
    hostEnqueue(loadHostState);
  }
}

/* ---------- player-side writes ---------- */
async function joinTable(rawName) {
  let nm = cleanName(rawName);
  if (!nm) { setErr('Enter a name to take a seat.'); return; }
  const taken = {};
  S.roster.forEach(function (r) { if (r.id !== S.me) taken[r.name.toLowerCase()] = true; });
  let base = nm, i = 2;
  while (taken[nm.toLowerCase()]) { nm = base.slice(0, 13) + ' ' + i; i++; }
  S.name = nm; S.nameDraft = nm; store('name', nm);
  try {
    await withRetry(function () { return S.db.doc('players/' + S.me).set({ name: nm, ts: Date.now() }); });
  } catch (e) { setErr(e); }
}
async function leaveTable() {
  try { await withRetry(function () { return S.db.doc('players/' + S.me).delete(); }); }
  catch (e) { setErr(e); }
}
async function sendAction(view, a) {
  const key = view.gameId + ':' + view.key;
  const body = { key: key, t: a.t, ts: Date.now() };
  if (a.to) body.to = a.to;
  await withRetry(function () { return S.db.doc('actions/' + S.me).set(body); });
}

const chatQ = {};
function chatWrite(path, field, msg, cap) {
  const prev = chatQ[path] || Promise.resolve();
  const next = prev.catch(function () {}).then(function () {
    return S.db.doc(path).get().then(function (snap) {
      const cur = snap.exists && Array.isArray((snap.data() || {})[field]) ? snap.data()[field].slice() : [];
      cur.push(msg);
      const body = { name: S.name || 'Player' };
      body[field] = cur.slice(-cap);
      return S.db.doc(path).set(body);
    });
  });
  chatQ[path] = next;
  return next;
}
async function sendChat(text) {
  text = String(text || '').replace(/\s+/g, ' ').trim().slice(0, 300);
  if (!text || !S.online) return;
  const dead = inGame() && pubPlayer(S.me) && !pubPlayer(S.me).alive;
  const msg = { t: Date.now(), x: text };
  if (dead) msg.g = 1;
  try { await chatWrite('chat/' + S.me, 'msgs', msg, 60); } catch (e) { setErr(e); }
}
async function sendMafiaChat(text) {
  text = String(text || '').replace(/\s+/g, ' ').trim().slice(0, 300);
  if (!text || !S.online) return;
  try { await chatWrite('outbox/' + S.me, 'msgs', { t: Date.now(), x: text }, 30); } catch (e) { setErr(e); }
}

/* ---------- host runtime ---------- */
function hostEnqueue(fn) {
  H.q = H.q.then(fn).catch(function (e) { setErr(e); });
  return H.q;
}
async function hostWrite(path, obj, force) {
  const json = JSON.stringify(obj);
  if (!force && H.written.get(path) === json) return;
  await withRetry(function () { return S.db.doc(path).set(JSON.parse(json)); });
  H.written.set(path, json);
}
async function hostCommit(force) {
  const st = H.state;
  if (!st) return;
  await hostWrite('hoststate/s', st, force);
  for (let i = 0; i < st.players.length; i++) {
    await hostWrite('views/' + st.players[i].id, E.playerView(st, st.players[i].id), force);
  }
  const pv = E.publicView(st);
  pv.hostId = S.me;
  pv.hostName = S.name || '';
  pv.at = Date.now();
  await hostWrite('game/public', pv, true);
}
async function loadHostState() {
  try {
    const snap = await withRetry(function () { return S.db.doc('hoststate/s').get(); });
    if (snap.exists && isHost()) {
      H.state = clone(snap.data());
      S.hostLost = false;
      H.written.clear();
      await hostCommit(true);
      await hostIngest();
    } else if (isHost()) {
      S.hostLost = true;
    }
  } finally {
    H.loading = false;
    render();
  }
}
async function deleteAll(coll) {
  const snap = await withRetry(function () { return S.db.collection(coll).get(); });
  for (let i = 0; i < snap.docs.length; i++) {
    const id = snap.docs[i].id;
    await withRetry(function () { return S.db.doc(coll + '/' + id).delete(); });
  }
}
function hostOpenLobby(keepCfg) {
  return hostEnqueue(async function () {
    H.state = null;
    H.written.clear();
    S.hostLost = false;
    const cfg = keepCfg && S.pub ? S.pub.cfg : null;
    const pub = {
      v: 1, gameId: newId(), hostId: S.me, hostName: S.name || '', phase: 'lobby', round: 0, key: 'L0',
      cfg: E.normalizeConfig(cfg), players: [], pending: [], dl: null, log: [], ballot: null,
      winner: null, recap: null, seq: 0, at: Date.now()
    };
    // Close the old table first so nobody keeps acting on stale data.
    await withRetry(function () { return S.db.doc('game/public').set(pub); });
    await deleteAll('actions');
    await deleteAll('views');
    await deleteAll('outbox');
    await deleteAll('chat');
    await withRetry(function () { return S.db.doc('hoststate/s').delete(); });
    S.view = null; S.sent = null; S.sel = null;
  });
}
function hostSetCfg(patch) {
  return hostEnqueue(async function () {
    if (!S.pub || S.pub.phase !== 'lobby' || !isHost()) return;
    const cfg = E.normalizeConfig(Object.assign({}, S.pub.cfg, patch));
    await withRetry(function () { return S.db.doc('game/public').update({ cfg: cfg, at: Date.now() }); });
  });
}
function hostStart() {
  return hostEnqueue(async function () {
    if (!S.pub || S.pub.phase !== 'lobby' || !isHost()) return;
    const roster = S.roster.slice();
    if (roster.length < MINP) { S.err = 'You need at least ' + MINP + ' players.'; render(); return; }
    if (roster.length > MAXP) { S.err = 'The table holds ' + MAXP + ' players. Remove ' + (roster.length - MAXP) + '.'; render(); return; }
    const st = E.newGame({
      gameId: S.pub.gameId,
      players: roster.map(function (r) { return { id: r.id, name: r.name }; }),
      cfg: S.pub.cfg, rng: secureRng, now: Date.now()
    });
    H.state = st;
    H.written.clear();
    S.hostLost = false;
    await hostCommit(true);
    await hostIngest();
  });
}
async function hostIngest() {
  const st = H.state;
  if (!st || st.phase === 'over' || !isHost()) return;
  const key = st.gameId + ':' + E.phaseKey(st);
  let subChanged = false, chatChanged = false;
  st.players.forEach(function (p) {
    if (!p.alive) return;
    const a = H.actions[p.id];
    if (!a || a.key !== key) return;
    const cur = st.sub[p.id];
    if (cur && cur.t === a.t && (cur.to || null) === (a.to || null)) return;
    if (E.submit(st, p.id, { t: a.t, to: a.to }).ok) subChanged = true;
  });
  st.players.forEach(function (m) {
    if (m.role !== 'mafia' || !m.alive) return;
    const d = H.outbox[m.id];
    if (!d || !Array.isArray(d.msgs)) return;
    const last = st.relay[m.id] || 0;
    let maxT = last;
    d.msgs.forEach(function (x) {
      if (!x || typeof x.x !== 'string' || typeof x.t !== 'number' || x.t <= last) return;
      if (x.t > maxT) maxT = x.t;
      if (st.phase !== 'night') return;
      const txt = x.x.replace(/\s+/g, ' ').trim().slice(0, 300);
      if (txt) { st.mafiaChat.push({ f: m.id, t: x.t, x: txt }); chatChanged = true; }
    });
    if (maxT !== last) { st.relay[m.id] = maxT; chatChanged = true; }
  });
  if (st.mafiaChat.length > 80) st.mafiaChat.splice(0, st.mafiaChat.length - 80);
  if (subChanged && E.ready(st)) E.advance(st, secureRng, Date.now());
  if (subChanged || chatChanged) await hostCommit();
}
function hostForce() {
  return hostEnqueue(async function () {
    const st = H.state;
    if (!st || st.phase === 'over' || !isHost()) return;
    E.advance(st, secureRng, Date.now());
    await hostCommit();
  });
}
function hostTick() {
  const st = H.state;
  if (!st || !isHost() || st.phase === 'over' || !st.dl) return;
  if (Date.now() >= st.dl) {
    hostEnqueue(async function () {
      const s = H.state;
      if (!s || s.phase === 'over' || !s.dl || Date.now() < s.dl) return;
      E.advance(s, secureRng, Date.now());
      await hostCommit();
    });
  }
}
function hostRemove(id) {
  return hostEnqueue(async function () {
    if (!isHost()) return;
    const st = H.state;
    if (!st) {
      await withRetry(function () { return S.db.doc('players/' + id).delete(); });
      return;
    }
    if (!E.removePlayer(st, id)) return;
    if (st.phase !== 'over' && E.ready(st)) E.advance(st, secureRng, Date.now());
    await hostCommit();
  });
}


/* ================= UI building blocks ================= */
let root, hdrEl, mainEl, dockEl, chatLogEl, chatForm, chatIn, chatHint, dockTitle;

function card() {
  const c = h('section', { class: 'card' });
  for (let i = 0; i < arguments.length; i++) add(c, arguments[i]);
  return c;
}
function btn(label, fn, o) {
  o = o || {};
  return h('button', {
    type: 'button', class: 'btn ' + (o.kind || ''), id: o.id, disabled: o.disabled,
    onclick: function (e) { if (o.disabled) return; fn(e); }
  }, label);
}
function confirmBtn(key, label, confirmLabel, run, kind) {
  const armed = S.confirm === key;
  return btn(armed ? confirmLabel : label, function () {
    if (armed) { S.confirm = null; run(); render(); return; }
    S.confirm = key; render();
    setTimeout(function () { if (S.confirm === key) { S.confirm = null; render(); } }, 5000);
  }, { kind: armed ? 'danger' : (kind || 'ghost'), id: 'cf-' + key });
}
function plural(r, c) { return c + ' ' + ROLE_TXT[r].title + (c > 1 && r !== 'mafia' ? 's' : ''); }
function rvLabel(rv) {
  if (!rv) return 'Out';
  if (rv === 'town') return 'Town';
  return ROLE_TXT[rv] ? ROLE_TXT[rv].title : 'Out';
}
function nameIn(players, id) {
  const p = players.find(function (x) { return x.id === id; });
  return p ? p.name : 'Player';
}
function rolePreview(n, cfg) {
  const nn = Math.min(Math.max(n, MINP), MAXP);
  const b = E.buildRoles(nn, cfg);
  const parts = ['mafia', 'doctor', 'police', 'prankster', 'civilian'].filter(function (r) { return b.counts[r]; })
    .map(function (r) { return plural(r, b.counts[r]); });
  return { text: 'With ' + nn + ' players: ' + parts.join(', ') + '.', notes: b.notes };
}

function seat(p, o) {
  o = o || {};
  const dead = p.alive === false;
  const cls = 'seat' + (dead ? ' dead' : '') + (o.selected ? ' sel' : '') + (o.selectable ? ' pick' : '');
  const sub = dead ? h('span', { class: 'sub', text: rvLabel(p.rv) })
    : o.blocked ? h('span', { class: 'sub', text: o.blocked })
    : o.pending ? h('span', { class: 'sub wait', text: 'deciding' }) : null;
  const inner = [
    h('span', { class: 'av', style: '--h:' + hue(p.id), text: (p.name || '?').charAt(0).toUpperCase() }),
    h('span', { class: 'sn' },
      h('span', { class: 'nm', text: p.name }),
      o.you ? h('em', { class: 'tag', text: 'you' }) : null,
      o.mate ? h('em', { class: 'tag ally', text: 'ally' }) : null),
    sub
  ];
  if (o.selectable) {
    return h('button', {
      type: 'button', class: cls, 'data-id': p.id, 'aria-pressed': o.selected ? 'true' : 'false',
      onclick: function () { o.onPick(p.id); }
    }, inner);
  }
  return h('div', { class: cls, 'data-id': p.id }, inner);
}

/* ================= shared game panels ================= */
function banner(pub) {
  const night = pub.phase === 'night';
  const over = pub.phase === 'over';
  const title = over ? 'Game over'
    : night ? 'Night ' + pub.round
    : 'Day ' + pub.round + (pub.phase === 'discuss' ? ' · Discussion' : ' · Vote');
  const sub = over ? ''
    : night ? 'The town sleeps. Everyone acts in secret.'
    : pub.phase === 'discuss' ? 'Talk it over. Move to the vote when everyone is ready.'
    : 'Vote someone out, or skip.';
  const pend = (pub.pending || []).map(function (id) { return nameOf(id); });
  const waiting = pend.length ? 'Waiting for ' + (pend.length > 4 ? pend.slice(0, 4).join(', ') + ' +' + (pend.length - 4) : pend.join(', ')) : '';
  return h('section', { class: 'banner ' + (night ? 'night' : over ? 'over' : 'day'), id: 'banner' },
    h('div', { class: 'bl' },
      icon(night ? 'moon' : 'sun', 26),
      h('div', {},
        h('h1', { class: 'bt', text: title }),
        sub ? h('p', { class: 'bs', text: sub }) : null,
        !over && waiting ? h('p', { class: 'bw', id: 'waiting', text: waiting }) : null)),
    pub.dl ? h('div', { class: 'timer', id: 'timer', 'aria-label': 'Time left' }) : null);
}

function rolePanel(v, players, local) {
  const r = v.me.role, t = ROLE_TXT[r];
  const open = local ? true : S.roleOpen;
  if (!open) {
    return h('div', { class: 'rolebar' },
      h('span', { class: 'dim', text: 'Your role is hidden' }),
      btn('Show', function () { S.roleOpen = true; render(); }, { kind: 'ghost small', id: 'showRole' }));
  }
  const kids = [
    h('div', { class: 'eyebrow', text: 'Your role' }),
    h('h2', { class: 'rname', text: t.title }),
    h('p', { class: 'rblurb', text: t.blurb })
  ];
  if (r === 'mafia' && v.mates.length) {
    kids.push(h('p', { class: 'allies' }, 'Your ally' + (v.mates.length > 1 ? 's: ' : ': '),
      v.mates.map(function (m, i) { return h('strong', { text: m.name + (m.alive ? '' : ' (out)') + (i < v.mates.length - 1 ? ', ' : '') }); })));
  }
  if (r === 'mafia' && !v.mates.length) kids.push(h('p', { class: 'allies', text: 'You are the only Mafia member.' }));
  if (!local) kids.push(btn('Hide', function () { S.roleOpen = false; render(); }, { kind: 'ghost small', id: 'hideRole' }));
  return h('section', { class: 'card role ' + r, id: 'roleCard' }, icon(r, 40), h('div', { class: 'rbody' }, kids));
}

function infoCard(v, players) {
  const rows = [];
  v.intel.forEach(function (i) {
    rows.push(h('li', {}, 'Night ' + i.r + ': ', h('strong', { text: nameIn(players, i.to) }), i.res === 'mafia' ? ' is Mafia.' : ' is not Mafia.'));
  });
  v.notes.forEach(function (n) { rows.push(h('li', {}, 'Night ' + n.r + ': ' + n.x)); });
  if (!rows.length) return null;
  return card(h('h3', { text: 'Private notes' }), h('ul', { class: 'plain' }, rows));
}

function actionPanel(v, players, submitFn, local) {
  const act = v.act;
  if (!act) {
    if (!v.me.alive) {
      return card(h('h2', { text: 'You are out' }),
        h('p', { class: 'dim', text: local ? 'Pass the device on.' : 'Keep what you know to yourself. You can still chat with the other ghosts below.' }));
    }
    return null;
  }
  const selKey = v.gameId + ':' + v.key + ':' + v.me.id;
  const sent = S.sent && S.sent.k === selKey ? S.sent : null;
  const mine = v.mine;
  const locked = !!(sent || mine);
  const lockedTo = sent ? sent.to : (mine ? mine.to : undefined);
  const doSubmit = function (a) {
    if (!local) { S.sent = { k: selKey, to: a.to }; }
    SFX.click();
    if (!local) render();
    Promise.resolve(submitFn(a)).catch(function (e) { S.sent = null; setErr(e); });
  };

  if (act.kind === 'sleep' || act.kind === 'ready') {
    const isSleep = act.kind === 'sleep';
    const c = card(
      h('h2', { text: isSleep ? 'Close your eyes' : 'Discussion' }),
      h('p', { class: 'dim', text: isSleep
        ? 'You have no night power. Tap below so nobody can tell who does.'
        : 'Talk it over. Tap when you are ready to vote. The vote opens when everyone is ready.' }),
      btn(locked ? (isSleep ? 'Sleeping…' : 'Ready. Waiting for the others…') : (isSleep ? 'Go to sleep' : 'I’m ready to vote'),
        function () { doSubmit({ t: act.kind }); }, { kind: 'primary', disabled: locked, id: 'actBtn' }));
    return c;
  }

  const txt = KIND_TXT[act.kind];
  const chosen = S.sel && S.sel.k === selKey ? S.sel.to : lockedTo;
  const mateSet = {};
  v.mates.forEach(function (m) { mateSet[m.id] = true; });
  const pick = function (id) { S.sel = { k: selKey, to: id }; SFX.click(); render(); };
  const grid = h('div', { class: 'seats' },
    players.filter(function (p) { return p.alive; }).map(function (p) {
      return seat(p, {
        selectable: act.targets.indexOf(p.id) !== -1, selected: chosen === p.id,
        blocked: act.blocked[p.id], you: p.id === v.me.id, mate: !!mateSet[p.id] && v.me.role === 'mafia', onPick: pick
      });
    }));
  const c = card(h('h2', { text: txt.title }), h('p', { class: 'dim', text: txt.prompt }), grid);
  if (act.skip) {
    c.appendChild(h('button', {
      type: 'button', class: 'seat skip' + (chosen === 'skip' ? ' sel' : ''), 'data-id': 'skip',
      'aria-pressed': chosen === 'skip' ? 'true' : 'false', onclick: function () { pick('skip'); }
    }, h('span', { class: 'sn' }, h('span', { class: 'nm', text: 'Skip. Nobody goes out.' }))));
  }
  const same = locked && chosen === lockedTo;
  const label = !chosen ? 'Pick an option' : same ? 'Locked in' : locked ? 'Change choice' : txt.btn;
  c.appendChild(btn(label, function () { doSubmit({ t: act.kind, to: chosen }); }, { kind: 'primary', disabled: !chosen || same, id: 'actBtn' }));
  if (locked && !local) c.appendChild(h('p', { class: 'hint', text: 'Locked in. You can change it until everyone has chosen.' }));
  if (v.me.role === 'mafia' && act.kind === 'kill') {
    const mv = Object.keys(v.mateVotes);
    if (mv.length) {
      c.appendChild(h('ul', { class: 'plain mates' }, mv.map(function (id) {
        const m = v.mates.find(function (x) { return x.id === id; });
        return h('li', {}, (m ? m.name : 'Ally') + ' picked ', h('strong', { text: nameIn(players, v.mateVotes[id]) }), '.');
      })));
    }
    if (!local) c.appendChild(mafiaChat(v));
  }
  return c;
}

function mafiaChat(v) {
  const who = {};
  who[v.me.id] = v.me.name;
  v.mates.forEach(function (m) { who[m.id] = m.name; });
  const log = h('div', { class: 'chatlog small', id: 'mchatLog' },
    v.mchat.length ? v.mchat.map(function (m) { return h('div', { class: 'msg' + (m.f === v.me.id ? ' mine' : '') }, h('b', { text: who[m.f] || 'Ally' }), ' ', h('span', { text: m.x })); })
      : h('p', { class: 'hint', text: 'Only Mafia can read this. Plan tonight’s target.' }));

/* ================= local pass-and-play ================= */
function defaultLocal() {
  return { stage: 'setup', names: ['', '', '', ''], cfg: E.defaultConfig(), st: null, kind: '', queue: [], i: 0, peek: '' };
}
function persistLocal() {
  const d = L.data;
  if (!d || d.stage === 'setup') return;
  store('local', d.stage === 'over' ? null : JSON.stringify(d));
}
function enterLocal(resume) {
  S.mode = 'local';
  L.data = null;
  if (resume) {
    try { L.data = JSON.parse(store('local')); } catch (e) { L.data = null; }
  }
  if (!L.data || !L.data.st) L.data = defaultLocal();
  render();
}
function exitLocal() { S.mode = 'auto'; render(); }
function localLiving() { return L.data.st.players.filter(function (p) { return p.alive; }).map(function (p) { return p.id; }); }
function localBegin(kind) {
  const d = L.data;
  d.kind = kind; d.queue = localLiving(); d.i = 0; d.stage = 'handoff';
  persistLocal(); render();
}
function localNext() {
  const d = L.data;
  d.i++;
  if (d.i < d.queue.length) { d.stage = 'handoff'; persistLocal(); render(); return; }
  const st = d.st;
  if (d.kind === 'roles') { localBegin('night'); return; }
  E.advance(st, secureRng, 0);
  if (st.phase === 'over') d.stage = 'over';
  else d.stage = d.kind === 'night' ? 'day' : 'result';
  persistLocal(); render();
}
function localStart() {
  const d = L.data;
  const players = d.names.map(function (nm, i) { return { id: 'L' + i, name: cleanName(nm) || 'Player ' + (i + 1) }; });
  if (players.length < MINP || players.length > MAXP) { setErr('Mafia needs ' + MINP + ' to ' + MAXP + ' players.'); return; }
  d.st = E.newGame({ gameId: 'local' + newId(), players: players, cfg: d.cfg, rng: secureRng, now: 0 });
  d.kind = 'roles'; d.queue = players.map(function (p) { return p.id; }); d.i = 0; d.stage = 'handoff';
  persistLocal(); render();
}
function localPlayers() {

  return [h('section', { class: 'card' }, h('h2', { text: 'Who is peeking?' }),
    h('p', { class: 'dim', text: 'Pick your name, then make sure nobody else is looking.' }),
    h('div', { class: 'seats' }, d.st.players.filter(function (p) { return p.alive; }).map(function (p) {
      return seat({ id: p.id, name: p.name, alive: true }, { selectable: true, onPick: function (id) { d.peek = id; d.stage = 'peek'; render(); } });
    })),
    btn('Back', function () { d.stage = 'day'; render(); }, { kind: 'ghost', id: 'peekBack' }))];
}
function localPeek() {
  const d = L.data;
  const v = E.playerView(d.st, d.peek);
  const info = infoCard(v, localPlayers());
  return [
    h('div', { class: 'rolebar mini' }, icon(v.me.role, 18), h('span', { text: v.me.name + ' · ' + ROLE_TXT[v.me.role].title })),
    info || card(h('p', { class: 'dim', text: 'No private notes right now.' })),
    card(btn('Hide', function () { d.peek = ''; d.stage = 'day'; render(); }, { kind: 'primary', id: 'peekDone' }))
  ];
}
function localResult() {
  const d = L.data;
  const pub = E.publicView(d.st);
  return [
    h('section', { class: 'banner day' }, h('div', { class: 'bl' }, icon('sun', 26), h('div', {}, h('h1', { class: 'bt', text: 'The votes are in' })))),
    newsCard(pub),
    seatsCard(pub, null),
    card(btn('Begin night ' + d.st.round, function () { localBegin('night'); }, { kind: 'primary', id: 'beginNight' }))
  ];
}
function localOver() {
  const d = L.data;
  const pub = E.publicView(d.st);
  return [
    resultCard(pub, null), rolesReveal(pub), recapCard(pub), newsCard(pub),
    card(h('div', { class: 'row' },
      btn('Play again', function () { const names = d.st.players.map(function (p) { return p.name; }); const cfg = d.cfg; L.data = defaultLocal(); L.data.names = names; L.data.cfg = cfg; store('local', null); render(); }, { kind: 'primary', id: 'again' }),
      btn('Exit', function () { store('local', null); exitLocal(); }, { kind: 'ghost', id: 'exitLocal' })))
  ];
}
function localScreen() {
  const d = L.data;
  if (!d) { L.data = defaultLocal(); return localSetup(); }
  const map = { setup: localSetup, handoff: localHandoff, role: localRole, act: localAct, day: localDay, peekpick: localPeekPick, peek: localPeek, result: localResult, over: localOver };
  return (map[d.stage] || localSetup)();
}

/* ================= chat dock ================= */
function canChat() {
  if (!S.online || !S.pub || S.mode === 'local') return { show: false };
  const pub = S.pub, me = pubPlayer(S.me);
  if (pub.phase === 'lobby') {
    const seated = S.roster.some(function (r) { return r.id === S.me; });
    return seated ? { show: true, ok: true } : { show: true, ok: false, why: 'Take a seat to chat.' };
  }
  if (!me) return { show: true, ok: false, why: 'Spectators cannot chat.' };
  if (pub.phase === 'over') return { show: true, ok: true };
  if (!me.alive) return { show: true, ok: true, ghost: true };
  if (pub.phase === 'night') return { show: true, ok: false, why: 'The table is silent at night.' };
  return { show: true, ok: true };
}
renderDock = function () {
  const c = canChat();
  dockEl.hidden = !c.show;
  if (!c.show) return;
  const pub = S.pub, me = pubPlayer(S.me);
  const iAmDead = !!(me && !me.alive);
  const seeAll = iAmDead || pub.phase === 'over';
  const all = [];
  Object.keys(S.chats).forEach(function (id) {
    const d = S.chats[id] || {};
    (Array.isArray(d.msgs) ? d.msgs : []).forEach(function (m) {
      if (!m || typeof m.x !== 'string') return;
      all.push({ id: id, name: d.name || 'Player', t: m.t || 0, x: m.x, g: !!m.g });
    });
  });
  all.sort(function (a, b) { return a.t - b.t; });
  const shown = all.filter(function (m) { return !m.g || seeAll; }).slice(-80);
  const near = chatLogEl.scrollHeight - chatLogEl.scrollTop - chatLogEl.clientHeight < 60;
  clear(chatLogEl);
  if (!shown.length) chatLogEl.appendChild(h('p', { class: 'hint', text: 'No messages yet.' }));
  shown.forEach(function (m) {
    const nm = pubPlayer(m.id) ? pubPlayer(m.id).name : (S.roster.find(function (r) { return r.id === m.id; }) || { name: m.name }).name;
    chatLogEl.appendChild(h('div', { class: 'msg' + (m.id === S.me ? ' mine' : '') + (m.g ? ' ghost' : '') }, h('b', { text: nm }), ' ', h('span', { text: m.x })));
  });
  if (near) chatLogEl.scrollTop = chatLogEl.scrollHeight;
  dockTitle.textContent = c.ghost ? 'Ghost chat' : 'Table talk';
  chatIn.disabled = !c.ok;
  chatIn.placeholder = c.ok ? (c.ghost ? 'Only ghosts can read this…' : 'Say something…') : 'Chat is closed';
  document.getElementById('chatSend').disabled = !c.ok;
  chatHint.textContent = c.ok ? (c.ghost ? 'Living players cannot see ghost messages.' : '') : (c.why || '');
};
function buildDock() {
  dockTitle = h('h2', { id: 'dockTitle', text: 'Table talk' });
  chatLogEl = h('div', { class: 'chatlog', id: 'chatLog', 'aria-live': 'polite' });
  chatIn = h('input', { id: 'chatIn', type: 'text', maxlength: '300', autocomplete: 'off', placeholder: 'Say something…', 'aria-label': 'Message' });
  chatForm = h('form', { class: 'chatform', id: 'chatForm' }, chatIn, h('button', { class: 'btn primary', type: 'submit', id: 'chatSend' }, 'Send'));
  chatHint = h('p', { class: 'hint', id: 'chatHint' });
  chatForm.addEventListener('submit', function (e) {
    e.preventDefault();
    const c = canChat();
    if (!c.show || !c.ok) return;
    const t = chatIn.value;
    chatIn.value = '';
    sendChat(t);
  });
  dockEl = h('aside', { class: 'card dock', id: 'dock', hidden: true }, dockTitle, chatLogEl, chatForm, chatHint);
}

/* ================= shell ================= */
function setTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}
function cycleTheme() {
  const cur = store('theme') || '';
  const next = cur === '' ? 'dark' : cur === 'dark' ? 'light' : '';
  store('theme', next || null);
  setTheme(next);
  render();
}
function renderHeader() {
  clear(hdrEl);
  const theme = store('theme') || '';
  let chip = '';
  if (S.mode === 'local') chip = 'One device';
  else if (S.online && S.pub) chip = S.pub.phase === 'lobby' ? 'Lobby' : S.pub.phase === 'over' ? 'Game over' : (S.pub.phase === 'night' ? 'Night ' : 'Day ') + S.pub.round;
  add(hdrEl,
    h('div', { class: 'hbrand' }, icon('mafia', 22), h('span', { class: 'logo', text: 'Mafia' }), chip ? h('span', { class: 'chip', id: 'chip', text: chip }) : null),
    h('div', { class: 'htools' },
      S.mode === 'local' ? btn('Leave', exitLocal, { kind: 'ghost small', id: 'leaveLocal' }) : null,
      h('button', { type: 'button', class: 'iconbtn', id: 'soundBtn', 'aria-label': S.sound ? 'Mute sound' : 'Turn sound on', 'aria-pressed': S.sound ? 'true' : 'false',
        onclick: function () { S.sound = !S.sound; store('sound', S.sound ? '1' : '0'); if (S.sound) SFX.click(); render(); } }, icon(S.sound ? 'vol' : 'mute')),
      h('button', { type: 'button', class: 'iconbtn', id: 'themeBtn', 'aria-label': 'Theme: ' + (theme || 'system'), title: 'Theme: ' + (theme || 'system'), onclick: cycleTheme }, icon('theme'))));
}
function errBar() {
  return h('div', { class: 'err', role: 'alert', id: 'errBar' }, h('span', { text: S.err }),
    h('button', { type: 'button', class: 'iconbtn', 'aria-label': 'Dismiss', onclick: function () { S.err = ''; render(); } }, icon('x', 16)));
}
function loadingCard(t) { return card(h('p', { class: 'dim', id: 'loading', text: t })); }

function screen() {
  if (S.boot) return [hero(false), loadingCard('Setting up the table…')];
  if (S.mode === 'local') return localScreen();
  if (S.online && S.pub) return onlineScreen();
  return homeScreen();
}

function captureFocus() {
  const a = document.activeElement;
  if (!a || !a.id || !(a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) return null;
  if (a === chatIn) return null;
  return { id: a.id, v: a.value, s: a.selectionStart, e: a.selectionEnd };
}
function restoreFocus(k) {
  if (!k) return;
  const el = document.getElementById(k.id);
  if (!el) return;
  if (el.tagName !== 'SELECT' && el.value !== k.v) el.value = k.v;
  try { el.focus(); if (k.s !== null && k.s !== undefined && el.setSelectionRange) el.setSelectionRange(k.s, k.e); } catch (e) { /* not selectable */ }
}

function cue() {
  const pub = S.online && S.mode !== 'local' ? S.pub : null;
  const key = pub ? pub.gameId + ':' + pub.key : '';
  if (key === S.lastKey) return;
  const had = S.lastKey;
  S.lastKey = key;
  if (!had || !pub) return;
  if (pub.phase === 'night') SFX.night();
  else if (pub.phase === 'discuss') {
    const last = (pub.log || [])[(pub.log || []).length - 1];
    if (last && last.ph === 'N' && /killed/.test(last.x)) SFX.kill(); else SFX.day();
  } else if (pub.phase === 'vote') SFX.vote();
  else if (pub.phase === 'over') {
    const me = inGame() && S.view && S.view.me ? S.view.me.role : null;
    if (me && (me === 'mafia') !== (pub.winner === 'mafia')) SFX.lose(); else SFX.win();
  }
}

function tickTimer() {
  const el = document.getElementById('timer');
  if (!el) return;
  if (!S.pub || !S.pub.dl) { el.textContent = ''; return; }
  const rem = (S.pub.dl - S.pub.at) - (Date.now() - S.pubAt);
  el.textContent = rem > 0 ? mmss(rem) : '0:00';
  el.classList.toggle('low', rem < 15000);
}

const OPEN = {};
render = function () {
  if (!root) return;
  const keep = captureFocus();
  cue();
  renderHeader();
  clear(mainEl);
  if (S.err) mainEl.appendChild(errBar());
  screen().forEach(function (n) { add(mainEl, n); });
  mainEl.querySelectorAll('details[id]').forEach(function (d) {
    if (Object.prototype.hasOwnProperty.call(OPEN, d.id)) d.open = OPEN[d.id];
    d.addEventListener('toggle', function () { OPEN[d.id] = d.open; });
  });
  renderDock();
  restoreFocus(keep);
  tickTimer();
};

function init() {
  root = document.getElementById('app');
  const t = store('theme');
  if (t === 'light' || t === 'dark') setTheme(t);
  hdrEl = h('header', { class: 'hdr', id: 'hdr' });
  mainEl = h('main', { class: 'main', id: 'main' });
  buildDock();
  const side = h('div', { class: 'side' }, dockEl);
  add(root, hdrEl, h('div', { class: 'cols' }, mainEl, side));
  render();
  setInterval(tickTimer, 500);
  setTimeout(function () { if (S.boot) { S.boot = false; render(); } }, 12000);
  initOnline().catch(function (e) { S.boot = false; setErr(e); });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

window.__mafia = { S: S, H: H, L: L, E: E };   // handy for debugging and tests
})();

</script>

.err { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--danger) 12%, var(--surface)); border: 1px solid var(--danger); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 700; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); }

.sumtab th.pn, .sumtab td.pn { text-align: left; }

.awards { list-style: none; margin: 4px 0 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: left; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ===== Badminton: an indoor court on the notebook page ===== */
:root { --s0: #3f7bff; --s1: #ff5c72; --good: #2e9b57; }
#app { max-width: 1100px; }
.main > .card, .main > .hero, .main > details, .main > .moregames { max-width: 720px; width: 100%; margin-inline: auto; }
.sdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
.sdot.s0 { background: var(--s0); } .sdot.s1 { background: var(--s1); }
.hero { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding-block: 8px 2px; }
.heroart { flex: none; transform: rotate(-2deg); filter: drop-shadow(0 12px 18px rgba(0,0,0,.35)); }
.herotx { flex: 1 1 260px; min-width: 0; }
.herotx h1 { margin: 0; font-family: var(--f-hand); font-weight: 700; font-size: clamp(48px, 11vw, 70px); line-height: .9; }
.herotx p { margin: 8px 0 0; color: var(--muted); font-size: 16px; max-width: 48ch; }
.how summary, #setD summary { list-style: none; } .how summary::-webkit-details-marker, #setD summary::-webkit-details-marker { display: none; }
.how summary::after, #setD summary::after { content: " +"; color: var(--muted); } .how[open] summary::after, #setD[open] summary::after { content: " –"; }
.howlist { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; color: var(--muted); }
.howlist b { color: var(--ink); }
.moregames { text-align: center; color: var(--muted); font-size: 14px; margin: 0; }
.moregames a { color: var(--accent); font-weight: 800; }

/* lobby */
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sidecol { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); min-width: 0; }
.sidecol.s0 { border-top: 4px solid var(--s0); } .sidecol.s1 { border-top: 4px solid var(--s1); }
.teamhead { display: flex; align-items: center; gap: 8px; }
.teamhead h3 { margin: 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
.teamhead .count { margin-left: auto; }
.members { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.members li { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 7px 9px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); min-height: 40px; }
.members li.off { opacity: .6; }
.members li .nm { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.members .emptyli { justify-content: center; border-style: dashed; background: transparent; color: var(--muted); font-size: 13px; }
.mini { margin-left: auto; font: inherit; font-size: 13px; font-weight: 800; padding: 2px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface2); color: var(--muted); cursor: pointer; }
.members .xbtn { margin-left: 0; }
.sidecol .btn { align-self: stretch; }
.botb { cursor: default; border: 0; text-transform: capitalize; background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--accent); }
button.botb { cursor: pointer; min-height: 24px; }
.addbot { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
@media (max-width: 420px) { .sides { grid-template-columns: 1fr; } }

/* game */
html.ingame #app { max-width: 1400px; padding-bottom: 8px; }
html.ingame .hdr { padding-block: 6px; margin-bottom: 6px; }
html.ingame .logo { font-size: 24px; }
html.ingame body { overscroll-behavior: none; }
html.ingame .main { gap: 8px; }
.scorebar { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; }
.sb { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px; border-radius: 12px; color: #fff; min-width: 0; }
.sb.s0 { background: #2f66d0; } .sb.s1 { background: #d6455d; }
.scorebar > .sb:last-child { flex-direction: row-reverse; }
.sb.serving { box-shadow: 0 0 0 3px var(--gold); }
.sb.serving .sbn::before { content: "🏸 "; }
.sbn { font-weight: 800; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.sbs { font-family: var(--f-hand); font-size: 34px; line-height: 1; font-weight: 700; }
.sbmid { display: grid; place-items: center; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.stage { position: relative; display: flex; flex-direction: column; gap: 8px; height: calc(100dvh - 150px); min-height: 440px; }
.stage:not(.playing) { height: calc(100dvh - 140px); }
.courtwrap { position: relative; flex: 1 1 auto; min-height: 0; border-radius: 16px; overflow: hidden; background: #16324a; touch-action: none; user-select: none; -webkit-user-select: none; }
.court { display: block; width: 100%; height: 100%; touch-action: none; }
.courtov { position: absolute; left: 0; right: 0; top: 8px; z-index: 2; display: flex; justify-content: center; pointer-events: none; padding: 0 56px 0 8px; }
.banner { padding: 6px 14px; border-radius: 99px; background: rgba(10, 14, 24, .78); color: #fff; font-size: 14px; font-weight: 700; text-align: center; animation: fade .25s ease; }
.banner.good b { color: #7cfc9a; } .banner.bad b { color: #ff8a7a; } .banner.mine { box-shadow: 0 0 0 2px var(--gold); } .banner.hot { color: #ffd23f; }

/* controls: portrait = a pad under the court; landscape = thumbs in the corners */
.controls { position: relative; display: flex; gap: 10px; height: 150px; flex: none; }
.stickzone { position: relative; flex: 1 1 45%; border-radius: 16px; background: color-mix(in srgb, var(--surface) 80%, transparent); border: 1px dashed var(--line); touch-action: none; overflow: hidden; }
.knob { position: absolute; display: none; width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); pointer-events: none; }
.kdot { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(255,255,255,.75); box-shadow: 0 2px 8px rgba(0,0,0,.4); }
.shots { flex: 1 1 55%; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; }
.shot { position: relative; border: 0; border-radius: 18px; color: #fff; font: inherit; font-weight: 900; font-size: 15px; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 4px 0 rgba(0,0,0,.35); transition: transform .06s ease, filter .15s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px; line-height: 1.1; text-align: center; }
.shot.hit, .shot:active { transform: translateY(3px) scale(.97); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.shot.clear { background: #2f8f5b; grid-column: 1; grid-row: 2; }
.shot.drop { background: #2a6fb8; grid-column: 1; grid-row: 1; }
.shot.smash { background: #d4503f; grid-column: 2; grid-row: 1 / span 2; font-size: 18px; }
.shot.risky { filter: saturate(.6) brightness(.9); box-shadow: inset 0 0 0 3px #ffd23f, 0 4px 0 rgba(0,0,0,.35); }
.shot.danger { background: #5a5f6e; box-shadow: inset 0 0 0 3px #ff6b5b, 0 4px 0 rgba(0,0,0,.35); }
.shot.danger .sl::after { content: " ⚠"; }
.sk { font-family: var(--f-mono); font-size: 10px; font-weight: 700; opacity: .7; display: none; }
@media (pointer: fine) { .sk { display: block; } }
.controls.inreach .shot { filter: brightness(1.12); }
.controls.inreach .shot.danger { filter: none; }
@media (orientation: landscape) and (max-height: 700px), (min-width: 900px) and (orientation: landscape) {
  .stage, .stage:not(.playing) { height: calc(100dvh - 118px); min-height: 280px; }
  .controls { position: absolute; inset: 0; height: auto; pointer-events: none; background: none; }
  .stickzone { position: absolute; left: 0; top: 0; bottom: 0; width: 38%; flex: none; pointer-events: auto; background: transparent; border: 0; }
  .shots { position: absolute; right: 10px; bottom: 10px; width: min(250px, calc(30% - 20px)); height: min(190px, 62%); pointer-events: auto; }
}
.below { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; }
.reacts { display: flex; gap: 5px; flex-wrap: wrap; }
.react { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 19px; cursor: pointer; }
.energy { display: flex; align-items: center; gap: 8px; flex: 1 1 160px; max-width: 320px; }
.elbl { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.ebar { flex: 1; height: 10px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.efill { display: block; height: 100%; width: 100%; border-radius: 99px; transition: width .2s linear; }
.efill.hi { background: #5fd08a; } .efill.mid { background: #ffd23f; } .efill.lo { background: #ff6b5b; }
.ctl { gap: 6px; }
.watching { margin: 0; color: var(--muted); font-weight: 700; }
.gx { font-weight: 900; font-size: 15px; }
@media (orientation: landscape) and (max-height: 520px) { .below .reacts { display: none; } html.ingame .hdr { display: none; } .stage, .stage:not(.playing) { height: calc(100dvh - 92px); } }

/* end of game */
.winner { align-items: center; text-align: center; }
.winner > .ico { color: var(--gold); }
.winner.s0 { border-top: 6px solid var(--s0); } .winner.s1 { border-top: 6px solid var(--s1); }
.winner .ov-t { font-size: 46px; }
.finalscore { display: flex; gap: 10px; justify-content: center; }
.fs { display: flex; flex-direction: column; align-items: center; padding: 8px 22px; border-radius: 14px; color: #fff; min-width: 110px; }
.fs.s0 { background: #2f66d0; } .fs.s1 { background: #d6455d; }
.fs .tname { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; opacity: .9; }
.fs .tscore { font-family: var(--f-hand); font-size: 46px; line-height: 1; }
.winner .ovbtns { max-width: 360px; }
.tablewrap { overflow-x: auto; }
.sumtab td.b { font-weight: 900; }
.sumtab tr.s0 td:first-child { box-shadow: inset 4px 0 0 var(--s0); } .sumtab tr.s1 td:first-child { box-shadow: inset 4px 0 0 var(--s1); }
.sumtab tr.me td { box-shadow: inset 0 2px 0 var(--gold), inset 0 -2px 0 var(--gold); }
.sumtab td.pn .cn { max-width: 140px; }
.courtwrap:focus { outline: none; }

/* controls panel */
.ctlpanel { display: flex; flex-direction: column; gap: 10px; }
.binds { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; }
.bindrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px 6px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.bindname { font-weight: 700; font-size: 14px; }
.bindkey { font: inherit; font-family: var(--f-mono); font-weight: 700; font-size: 13px; min-width: 64px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.bindkey.wait { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); font-family: var(--f-body); }

/* touch screens: no double-tap zoom, pinch zoom, text selection or long-press menus while playing */
html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
html.ingame, html.ingame body { overflow-x: hidden; }
.stage, .stage * { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
.scorebar, .below { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }

/* the joystick area shows a symbol, not text, so a long press can never select anything */
.stickzone::before { content: "✥"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 34px; color: var(--muted); opacity: .45; pointer-events: none; }
@media (orientation: landscape) and (max-height: 700px), (min-width: 900px) and (orientation: landscape) { .stickzone::before { content: none; } }
.stickzone, .controls, .shot { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.runhint { margin: 0; font-size: 12px; color: var(--muted); font-weight: 700; }

/* in-game settings sheet */
.gearbtn { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; margin-bottom: 2px; }
.sbmid { gap: 2px; }
.sheet { position: fixed; inset: 0; z-index: 70; background: rgba(8, 10, 18, .6); display: grid; place-items: center; padding: 14px; overflow-y: auto; touch-action: pan-y; }
.sheetbox { width: min(560px, 100%); max-height: calc(100dvh - 28px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 24px 50px -20px rgba(0,0,0,.7); }
.sheet, .sheet * { -webkit-user-select: none; user-select: none; }
.sensrow { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sensval { font-family: var(--f-mono); font-weight: 700; font-size: 13px; color: var(--accent); }
#sensRange { width: 100%; accent-color: var(--accent); height: 28px; touch-action: pan-x; }
.sensticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-weight: 700; }

/* hydration break */
.breakov { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; background: rgba(8, 12, 22, .55); animation: fade .2s ease; }
.breakcard { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 22px; border-radius: 18px; background: var(--surface); color: var(--ink); box-shadow: 0 20px 40px -18px rgba(0,0,0,.7); text-align: center; min-width: 220px; }
.breakcard .bicon { font-size: 36px; line-height: 1; }
.breakcard b { font-size: 18px; }
.breakcard span { color: var(--muted); font-size: 14px; }
.breakov, .breakov * { touch-action: manipulation !important; }

</style>
</head>

        var b = bin.read();

        return b;

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];

            } else {

              bytes.push(b & 0xff);
            }
          } else {

          }
        }
      }
      return bytes;
    };
